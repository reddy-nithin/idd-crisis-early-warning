[project]
name = "psych-crisis"
version = "0.1.0"
description = "Early warning of psychiatric crisis from incident reports of people with IDD (feasibility study)"
readme = "README.md"
authors = [
    { name = "Nithin Reddy", email = "reddy.nithin.0331@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
    "streamlit>=1.66.1",
    "tabpfn>=9.2.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
